# Full local stack for reviewers: Postgres with pgvector, the API, the worker
# and the web app.
#
#   docker compose up --build
#
# Web app: http://localhost:3000    API docs: http://localhost:8000/api/docs
#
# The database password below is a local-only placeholder. Uploaded files stay
# on the `uploads` volume, so no Supabase project is needed. Real keys (Gemini)
# go in a .env file beside this one, which Git ignores.

name: docintel

x-backend-env: &backend-env
  APP_ENV: development
  DATABASE_URL: postgresql+psycopg://docintel:${POSTGRES_PASSWORD:-docintel-local}@db:5432/docintel
  CORS_ORIGINS: http://localhost:3000
  EMBED_DIM: ${EMBED_DIM:-768}
  # Files on a shared local volume instead of Supabase Storage (DECISIONS.md D32).
  STORAGE_BACKEND: local
  LOCAL_STORAGE_DIR: /data/uploads

x-backend: &backend
  build: ./backend
  image: docintel-backend:local
  env_file:
    - path: .env
      required: false
  environment: *backend-env
  volumes:
    - uploads:/data/uploads
  restart: unless-stopped

services:
  db:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_USER: docintel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docintel-local}
      POSTGRES_DB: docintel
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docintel -d docintel"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # API process. Runs migrations before it starts.
  backend:
    <<: *backend
    command: ["./start.sh", "api"]
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/live', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 20

  # Background worker. Starts after the API, so migrations have run.
  worker:
    <<: *backend
    command: ["./start.sh", "worker"]
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    image: docintel-frontend:local
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
