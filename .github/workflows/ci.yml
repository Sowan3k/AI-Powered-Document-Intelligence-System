name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff, migrations, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: docintel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d docintel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      # Throwaway CI database in a service container, not a secret.
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/docintel_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/docintel_test
      # OCR tests fail instead of skipping if Tesseract is missing.
      REQUIRE_TESSERACT: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install Tesseract
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng
          tesseract --version

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint (backend and dataset generator)
        run: ruff check . ../eval

      - name: Ruff format check
        run: ruff format --check . ../eval

      - name: Apply migrations
        run: alembic upgrade head

      - name: Check models match migrations
        run: alembic check

      - name: Pytest (unit and integration)
        run: >-
          pytest
          --junitxml=reports/pytest-junit.xml
          --cov=app --cov-report=term --cov-report=xml:reports/coverage.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/reports/
          retention-days: 30

      # The synthetic files, downloadable from the run page, for trying the live
      # site or recording the walkthrough from a phone (docs/WALKTHROUGH.md).
      - name: Build the demo files
        working-directory: eval/generate
        run: python -m synth --out ../../demo-files --scale 1

      - name: Upload the demo files
        uses: actions/upload-artifact@v4
        with:
          name: demo-files
          path: demo-files/
          retention-days: 30

  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # On a pull request the action lists the PR's commits through the API,
    # which needs pull-requests: read (without it: HTTP 403 on PR #2).
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # scan the full history, not only the last commit

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.28.0

  docker:
    name: Docker images and compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5

      - name: Build images
        run: docker compose build

      - name: Tesseract is installed in the backend image
        run: docker run --rm docintel-backend:local tesseract --version

      - name: Ingestion libraries load in the backend image
        run: >-
          docker run --rm docintel-backend:local python -c
          "import cv2, pymupdf, pytesseract, openpyxl, xlrd, app.ingest.reader;
          print('tesseract', pytesseract.get_tesseract_version(), 'pymupdf', pymupdf.__version__)"

      - name: Start the stack
        run: docker compose up -d --wait --wait-timeout 180

      - name: API reports a connected database and working storage
        run: |
          body=$(curl -sS --fail http://localhost:8000/api/health)
          echo "$body"
          echo "$body" | grep -q '"database":"connected"'
          echo "$body" | grep -q '"storage":"ok"'

      - name: Upload a CSV, let the worker process it, search for it
        run: |
          set -euo pipefail
          api=http://localhost:8000/api
          token=$(curl -sS --fail -X POST "$api/auth/login" -H 'Content-Type: application/json' \
            -d '{"username":"reviewer","password":"docintel-demo"}' | jq -r .access_token)
          auth="Authorization: Bearer $token"
          printf 'Invoice No,Invoice Date,Supplier,Total,Currency\nINV-CI-0001,2026-10-01,Acme Traders Ltd,120.50,USD\n' > /tmp/ci.csv
          job=$(curl -sS --fail -H "$auth" -F "files=@/tmp/ci.csv;type=text/csv" "$api/documents" \
            | jq -r '.documents[0].job_id')
          for _ in $(seq 1 30); do
            state=$(curl -sS --fail -H "$auth" "$api/jobs/$job" | jq -r .status)
            echo "job $job: $state"
            [ "$state" = succeeded ] && break
            [ "$state" = failed ] && exit 1
            sleep 2
          done
          [ "$state" = succeeded ]
          curl -sS --fail -H "$auth" "$api/search?q=INV-CI-0001" | tee /tmp/hits.json
          jq -e '.total == 1 and .items[0].total == "120.50"' /tmp/hits.json

      - name: Web app responds
        run: curl -sS --fail -o /dev/null -w "%{http_code}\n" http://localhost:3000/

      - name: Worker is running
        run: docker compose logs worker | grep -q "worker .* started"

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down -v
